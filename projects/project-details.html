<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study Details | MOHAMED SHERIF M</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Red & Black CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="padding-top: 40px; background-color: #040406;">

  <!-- Ambient Red Glows -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-blob blob-red-top"></div>
    <div class="ambient-blob blob-red-bottom"></div>
  </div>

  <div class="tech-grid-bg" aria-hidden="true"></div>

  <div class="container py-4" style="position: relative; z-index: 2;">
    <!-- Top Navigation Bar -->
    <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-white border-opacity-10">
      <a href="../index.html#projects" class="btn-custom btn-outline-white btn-sm-custom">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Portfolio</span>
      </a>
      <a class="navbar-brand m-0" href="../index.html">
        <span class="brand-bracket">&lt;</span>MohamedSherif<span class="brand-bracket"> /&gt;</span>
      </a>
    </div>

    <!-- Main Project Header -->
    <div class="mb-5">
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="badge bg-danger bg-opacity-25 text-red border border-danger border-opacity-25 px-3 py-1 rounded-pill" id="detailCategory">Full-Stack Case Study</span>
        <span class="text-muted small" id="detailYear">2024</span>
      </div>
      <h1 class="hero-title mb-3" id="detailTitle">Disaster Relief Management System</h1>
      <p class="lead text-muted" id="detailShortDesc" style="max-width: 840px; line-height: 1.8;"></p>
    </div>

    <!-- Case Study Content Container (01 to 08) -->
    <div id="detailCaseStudyBody">
      <!-- Populated via script -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom text-center py-4 border-top border-white border-opacity-10 mt-5">
    <p class="text-muted small mb-0">&copy; 2026 MOHAMED SHERIF M. Built with HTML5, CSS3, Vanilla JavaScript &amp; Bootstrap 5.</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/projects-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get("id") || "disaster-relief-system";
      const projects = window.portfolioProjects || [];
      const project = projects.find(p => p.id === projectId) || projects[0];

      if (!project) return;

      document.getElementById("detailTitle").textContent = project.title;
      document.getElementById("detailCategory").textContent = project.category;
      document.getElementById("detailYear").textContent = project.year;
      document.getElementById("detailShortDesc").textContent = project.shortDescription;

      const body = document.getElementById("detailCaseStudyBody");

      if (project.caseStudy) {
        const cs = project.caseStudy;
        body.innerHTML = `
          <!-- 01 OVERVIEW -->
          <div class="glass-card case-block mb-4">
            <div class="case-block-num">01 // OVERVIEW</div>
            <h3 class="h4 text-white fw-bold mb-3">Project Overview</h3>
            <p class="text-muted lead" style="line-height: 1.8;">${cs.step01_Overview}</p>
          </div>

          <!-- RESUME ACHIEVEMENTS -->
          <div class="glass-card case-block mb-4 card-red-top">
            <div class="case-block-num">OFFICIAL RESUME SPECIFICATIONS</div>
            <h4 class="h5 text-white fw-bold mb-3">Key Technical Contributions</h4>
            <ul class="list-unstyled mb-0">
              ${project.resumeBullets.map(b => `<li class="text-muted mb-2" style="font-size: 0.95rem; line-height: 1.7;"><span class="text-red me-2">▹</span>${b}</li>`).join("")}
            </ul>
          </div>

          <!-- 02 PROBLEM & 03 SOLUTION -->
          <div class="row g-4 mb-4">
            <div class="col-lg-6">
              <div class="glass-card case-block h-100 mb-0 card-red-top">
                <div class="case-block-num">02 // PROBLEM STATEMENT</div>
                <h4 class="h5 text-white fw-bold mb-3">Operational Friction in Crisis Response</h4>
                <p class="text-muted" style="line-height: 1.7;">${cs.step02_Problem}</p>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="glass-card case-block h-100 mb-0 card-red-top">
                <div class="case-block-num">03 // ENGINEERING SOLUTION</div>
                <h4 class="h5 text-white fw-bold mb-3">Unified Dynamic Platform</h4>
                <p class="text-muted" style="line-height: 1.7;">${cs.step03_Solution}</p>
              </div>
            </div>
          </div>

          <!-- 04 KEY MODULES -->
          <div class="glass-card case-block mb-4">
            <div class="case-block-num">04 // KEY SYSTEM MODULES</div>
            <h3 class="h4 text-white fw-bold mb-4">Core Operational Modules</h3>
            <div class="row g-3">
              ${cs.step04_KeyModules.map(m => `
                <div class="col-md-6 col-lg-4">
                  <div class="p-3 rounded-2 h-100" style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle);">
                    <span class="font-monospace small text-red fw-bold d-block mb-1">${m.code}</span>
                    <h5 class="h6 text-white mb-2">${m.name}</h5>
                    <p class="text-muted small mb-0" style="line-height: 1.6;">${m.desc}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- 05 TECHNOLOGIES -->
          <div class="glass-card case-block mb-4">
            <div class="case-block-num">05 // ARCHITECTURE &amp; TECHNOLOGIES</div>
            <h3 class="h4 text-white fw-bold mb-4">Full-Stack Technology Stack</h3>
            <div class="row g-3">
              ${cs.step05_Technologies.map(t => `
                <div class="col-sm-6 col-lg-4">
                  <div class="p-3 rounded-2 h-100" style="background: rgba(239, 68, 68, 0.06); border: 1px solid var(--border-red);">
                    <div class="fw-bold text-white mb-1">${t.name}</div>
                    <div class="text-red font-monospace small mb-2">${t.category}</div>
                    <p class="text-muted small mb-0">${t.desc}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>

          <!-- 06 SCREENSHOT GALLERY -->
          <div class="glass-card case-block mb-4">
            <div class="case-block-num">06 // SCREENSHOT GALLERY</div>
            <h3 class="h4 text-white fw-bold mb-4">Interface Walkthrough</h3>
            
            <div class="project-gallery-carousel mb-3">
              <div class="carousel-main-slide" style="height: 480px;">
                <img id="detailActiveImage" src="" alt="Screenshot">
                <div class="carousel-caption-bar d-flex justify-content-between align-items-center">
                  <span id="detailActiveCaption">Caption</span>
                  <span class="badge bg-danger bg-opacity-75 text-white" id="detailSlideCounter">1 / 6</span>
                </div>
              </div>
              <button class="gallery-nav-btn gallery-prev" id="detailPrevBtn" aria-label="Previous">
                <i class="bi bi-chevron-left"></i>
              </button>
              <button class="gallery-nav-btn gallery-next" id="detailNextBtn" aria-label="Next">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>

            <div class="gallery-thumbs-row" id="detailThumbsContainer"></div>
          </div>

          <!-- 07 & 08 ACTIONS -->
          <div class="glass-card p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <div class="case-block-num">07 &amp; 08 // DEPLOYMENT &amp; SOURCE REPOSITORY</div>
              <h4 class="h5 text-white fw-bold mb-1">Verify Source Code &amp; Prototype</h4>
              <p class="text-muted small mb-0">Repository: <code class="text-red">${project.github}</code></p>
            </div>
            <div class="d-flex gap-3">
              <a href="${project.liveDemo}" class="btn-custom btn-primary-red" target="_blank" rel="noopener noreferrer" onclick="handleLinkClick(event, '${project.liveDemo}', 'Live Demo')">
                <span>Live Demo</span>
                <i class="bi bi-box-arrow-up-right"></i>
              </a>
              <a href="${project.github}" class="btn-custom btn-outline-white" target="_blank" rel="noopener noreferrer">
                <span>GitHub Repo</span>
                <i class="bi bi-github"></i>
              </a>
            </div>
          </div>
        `;

        let currentSlide = 0;
        const gallery = project.gallery || [];

        function updateGallerySlide() {
          if (!gallery.length) return;
          const item = gallery[currentSlide];
          const imgUrl = item.url.startsWith("../") ? item.url : `../${item.url}`;
          document.getElementById("detailActiveImage").src = imgUrl;
          document.getElementById("detailActiveCaption").textContent = item.caption;
          document.getElementById("detailSlideCounter").textContent = `${currentSlide + 1} / ${gallery.length}`;

          document.querySelectorAll(".gallery-thumb").forEach((th, idx) => {
            th.classList.toggle("active", idx === currentSlide);
          });
        }

        document.getElementById("detailThumbsContainer").innerHTML = gallery.map((item, idx) => `
          <div class="gallery-thumb ${idx === 0 ? 'active' : ''}" data-index="${idx}">
            <img src="../${item.url}" alt="Thumbnail ${idx + 1}">
          </div>
        `).join("");

        document.querySelectorAll(".gallery-thumb").forEach(th => {
          th.addEventListener("click", () => {
            currentSlide = parseInt(th.getAttribute("data-index"), 10);
            updateGallerySlide();
          });
        });

        document.getElementById("detailPrevBtn").addEventListener("click", () => {
          currentSlide = (currentSlide - 1 + gallery.length) % gallery.length;
          updateGallerySlide();
        });

        document.getElementById("detailNextBtn").addEventListener("click", () => {
          currentSlide = (currentSlide + 1) % gallery.length;
          updateGallerySlide();
        });

        updateGallerySlide();
      }
    });

    function handleLinkClick(e, url, type) {
      if (!url || url === "#") {
        e.preventDefault();
        alert(`ℹ️ ${type} URL is currently set to placeholder "#" in js/projects-data.js`);
      }
    }
  </script>
</body>
</html>
